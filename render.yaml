services:
  - type: web
    name: noteflame
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && node scripts/init-db.js
    startCommand: node server.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: noteflame-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: ENCRYPTION_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: APP_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: GOOGLE_ADSENSE_ID
        sync: false

databases:
  - name: noteflame-db
    plan: free
    region: oregon
    databaseName: noteflame
    user: noteflame
